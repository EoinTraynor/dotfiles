# Starship prompt configuration
# Managed by chezmoi

add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ "
untracked = "? "
stashed = "📦 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[nodejs]
symbol = "⬢ "
style = "bold green"
format = "[$symbol($version )]($style)"

[golang]
symbol = "🐹 "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "
